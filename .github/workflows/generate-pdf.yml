name: Generate Resume PDF

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # md-to-pdf renders with headless Chrome, so the embedded CSS layout is kept.
      - name: Render PDF
        run: npx --yes md-to-pdf@5 --config-file .md-to-pdf.json CV_Mario_Moreno.md

      - name: Check page count
        run: |
          sudo apt-get install -y -qq poppler-utils >/dev/null
          pages=$(pdfinfo CV_Mario_Moreno.pdf | awk '/^Pages:/ {print $2}')
          echo "Pages: $pages"
          test "$pages" -eq 1

      - name: Prepare output
        run: |
          mkdir -p final_cv
          mv CV_Mario_Moreno.pdf final_cv/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CV_Mario_Moreno
          path: final_cv/CV_Mario_Moreno.pdf

      - name: Deploy to pdf-download branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./final_cv
          publish_branch: pdf-download
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
